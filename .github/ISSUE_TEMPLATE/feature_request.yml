name: Feature request
description: Something Bogen should be able to do.
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Canvas or editor
        - MCP and agents
        - Capture and import
        - Export and code
        - Brands
        - Sync and devices
        - Phone
        - Omarchy
        - Install
        - Docs
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task, and what stands in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: For a new capability, say how an agent would use it as well as how a person would.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself.
